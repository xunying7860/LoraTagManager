// API Key 显示/隐藏切换（type password <-> text）
function toggleKeyVisibility(inputId, btn) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const hidden = el.type === "password";
  el.type = hidden ? "text" : "password";
  btn.textContent = hidden ? "隐藏" : "显示";
}

function saveSettings() {
  const body = {
    deepseek: {
      api_key: document.getElementById("dsKey").value.trim(),
      base_url: document.getElementById("dsUrl").value.trim(),
      model: document.getElementById("dsModel").value.trim(),
    },
    lmstudio: {
      base_url: document.getElementById("lmUrl").value.trim(),
      model: document.getElementById("lmModel").value.trim(),
      vllm_enabled: document.getElementById("vllmMode").value === "true",
    },
    screen_provider: document.getElementById("screenProvider").value,
    save_concurrency: parseInt(document.getElementById("saveConc").value, 10) || 100,
    preview_size: parseInt(document.getElementById("psSize").value, 10) || 0,
    llm_prompts: state.llmPrompts || [],
    llm_prompt_active: (typeof state.llmPromptActive === "number" ? state.llmPromptActive : -1),
    font_size: document.getElementById("fsSize").value,
  };
  api("/api/settings", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) }).then(r => {
    if (r.ok) {
      state.previewSize = body.preview_size;
      state.saveConcurrency = body.save_concurrency;
      applyFontSize(body.font_size);  // 字号即时生效
      setMsg("设置已自动缓存" + (state.previewSize ? `（缩略图 ${state.previewSize}px）` : "（原图模式）") + `，全部保存并发 ${state.saveConcurrency}`);
      renderGrid(); // 立即用新缩略图尺寸重绘
    }
  });
}

  document.getElementById("modalRoot").classList.remove("show");
}

// ---------- 事件委托（避免路径/标签内联转义 bug） ----------
function bindDelegates() {
  // 键盘快捷键：Ctrl+Z 撤销 / Ctrl+Y 或 Ctrl+Shift+Z 重做
  document.addEventListener("keydown", e => {
    // G3：输入框/文本域内不拦截 Ctrl+Z/Y（保留浏览器原生输入撤销）
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
      if (e.shiftKey) redo(); else undo();
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
      redo();
      e.preventDefault();
    }
  });
  // 点击页面其他位置关闭翻译右键菜单
  document.addEventListener("click", e => {
    if (!e.target.closest("#translateMenu")) hideTranslateMenu();
  });
  // 文件夹路径输入：防抖自动扫描（输入中 600ms 防抖；失焦立即扫描；回车立即扫描）
  document.getElementById("folderInput").addEventListener("input", autoScanInput);
  document.getElementById("folderInput").addEventListener("blur", autoScanBlur);
  document.getElementById("folderInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { clearInterval(_scanPollTimer); scanFolder(); }
  });
  // 缓存上次填写的路径：失焦时用 sendBeacon 记录（页面刷新/关闭时不丢失——普通 fetch 会被卸载中断）
  document.getElementById("folderInput").addEventListener("blur", () => {
    const v = document.getElementById("folderInput").value.trim();
    if (!v) return;
    try {
      navigator.sendBeacon("/api/recent", new Blob([JSON.stringify({folder: v})], {type: "application/json"}));
    } catch (e) {
      api("/api/recent", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({folder: v}) });
    }
  });
  // 图片卡片：点击切换选中（data-path 取路径，避免 \t 等转义破坏）
  document.getElementById("grid").addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (card && card.dataset.path) toggleSelect(card.dataset.path, e.ctrlKey || e.metaKey);
  });
  // 全部标签行：点击筛选
  document.getElementById("allTags").addEventListener("click", e => {
    const row = e.target.closest(".tag-row");
    if (row && row.dataset.tag) setFilter(row.dataset.tag);
  });
  // 共同标签 chip：点击筛选
  document.getElementById("commonTags").addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (c && c.dataset.tag) setFilter(c.dataset.tag);
  });
  // 编辑条标签 chip：点击 ✕ 移除（点击 chip 本体不再删除，仅拖拽排序）
  document.getElementById("editorTags").addEventListener("click", e => {
    const del = e.target.closest(".del");
    if (del) {
      const c = del.closest(".chip");
      if (c && c.dataset.tag) removeTagFromSelection(c.dataset.tag);
      return;
    }
    // 单击 chip 本体（未拖拽）→ 进入编辑模式（修改标签，提交后自动翻译）
    if (window.__justDragged) return;  // 拖拽刚结束，忽略这次 click
    const chip = e.target.closest(".chip");
    if (chip && chip.dataset.tag && !chip.querySelector("input")) {
      startEditTag(chip);
    }
  });
  // 丢弃区 chip：点击 chip 本体 = 放回该标签到对应图片（data-img 标记所属图片）
  document.getElementById("screenBox").addEventListener("click", e => {
    // ✕ = 彻底移除（不再放回）；chip 本体 = 放回原标签
    const del = e.target.closest(".del");
    if (del) {
      const c = del.closest(".chip");
      if (c && c.dataset.tag && c.dataset.img) removeFromDiscard(c.dataset.img, c.dataset.tag);
      return;
    }
    const c = e.target.closest(".chip");
    if (c && c.dataset.tag && c.dataset.img) restoreDiscarded(c.dataset.img, c.dataset.tag);
  });
  // ========== 编辑条标签拖拽排序（SortableJS，仿 weilin 节点方案） ==========
  // 说明：weilin 节点内置 SortableJS（自动避让动画/ghost 克隆/跨行处理），
  // 直接复用成熟库，避免手写拖拽的动画打断/引用过期/鬼畜问题
  const et = document.getElementById("editorTags");
  window.__initSortable = function initSortable() {
    if (window.__sortable) window.__sortable.destroy();
    window.__sortable = new Sortable(et, {
      animation: 150,          // 避让动画时长（与 weilin 节点一致）
      ghostClass: "chip-drag-ghost",   // 被拖元素的幽灵样式
      dragClass: "chip-drag-active",
      chosenClass: "chip-drag-chosen",
      // 强制走 mousedown/mousemove 模拟拖拽（与手写方案同路径，真实 Edge 实测有效）：
      // SortableJS 默认在 Chromium 用 pointerdown + 原生 dragstart，本机（触摸屏+150% DPI）
      // 该路径拖拽不启动；forceFallback 强制用鼠标事件模拟，与用户第一版能拖的方案一致。
      forceFallback: true,
      fallbackOnBody: true,    // ghost 挂 body，避免被 #editorTags 的 overflow 容器裁剪
      fallbackClass: "chip-drag-ghost",  // 关键：克隆 ghost 用 fallbackClass（默认 sortable-fallback），
                                         // 必须指向我们的 ghost 类，否则 .chip 的 transition 0.12s
                                         // 会作用在 ghost 上 → 拖快时 ghost 滞后于鼠标（实测 400px+）
      fallbackTolerance: 4,    // 4px 内视为点击（不误触发拖拽）
      draggable: ".chip",      // 显式指定可拖元素（仿 weilin 的 draggable: ".prompt-tag"）
      handle: ".en-line, .zh-line",  // 仿 weilin 的 handle: ".prompt-tag-value"：
                                     // 只在文字区起拖，✕ 永远不触发拖拽 → 点击删除稳定
      // ⚠️ 不要加 filter: ".del"！实测：按下点落在 ✕ 上（chip 右下角 12x12 区域）再拖动，
      // filter 会拦截整个拖拽 -> 无 ghost、无避让、顺序不变（用户报告的"完全拖不动"症状）。
      // 点击 ✕（按下不动即松开）的 click 事件不受影响，仍正常删除标签；
      // 按住 ✕ 拖动则视为拖拽排序，符合用户预期。
      onStart: evt => {
        // 多选（并集展示）时明确提示不可拖拽，避免用户困惑
        const sel = state.images.filter(img => state.selected.has(img.path));
        if (sel.length !== 1) setMsg("多选状态不可拖动排序，单击图片切换单选后即可拖动");
      },
      onMove: evt => {
        // 多选选中（并集展示）时禁止拖拽——DOM 顺序与 tags 不对应，拖了会错乱
        const sel = state.images.filter(img => state.selected.has(img.path));
        return sel.length === 1;
      },
      onEnd: evt => {
        // 拖拽结束标记：阻止紧随的 click 进入标签编辑模式
        window.__justDragged = true;
        setTimeout(() => { window.__justDragged = false; }, 200);
        // 仅单图选中时可排序；多图并集展示不允许重排
        const sel = state.images.filter(img => state.selected.has(img.path));
        if (sel.length !== 1 || evt.oldIndex === evt.newIndex) return;
        const img = sel[0];
        pushUndo("mem", {images: [{path: img.path, tags: [...img.tags], disc: [...(state.discardMap[img.path] || [])]}]});
        const [moved] = img.tags.splice(evt.oldIndex, 1);
        img.tags.splice(evt.newIndex, 0, moved);
        setMsg(`已调整标签顺序: ${moved}`);
        // Sortable 已重排 DOM，与 img.tags 一致，无需再 renderGrid（避免闪烁）
      },
    });
  };
  // 初始化（renderEditor 每次重建 chips 后也会调用 __initSortable）
  window.__initSortable();

  // 词库面板：lib-tag 点击直接添加（委托到 editor，面板在编辑条内）
  document.getElementById("editor").addEventListener("click", e => {
    const lt = e.target.closest(".lib-tag");
    if (lt && lt.dataset.en) libPick(lt.dataset.en);
  });
  // ========== 分割条拖拽（调整区域大小，其他区域自动适应） ==========
  const sidebar = document.getElementById("sidebar");
  const editor = document.getElementById("editor");
  const vs = document.getElementById("vSplitter");
  const hs = document.getElementById("hSplitter");
  // 垂直分割条：调整左侧标签面板宽度（min 180 / max 560）
  vs.addEventListener("mousedown", e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = sidebar.offsetWidth;
    vs.classList.add("resizing");
    document.body.classList.add("resizing");
    const onMove = ev => {
      const w = Math.min(560, Math.max(180, startW + (ev.clientX - startX)));
      sidebar.style.width = w + "px";
    };
    const onUp = () => {
      vs.classList.remove("resizing");
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      try { localStorage.setItem("loraSidebarW", String(sidebar.offsetWidth)); } catch (err) {}
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  // 水平分割条：调整底部编辑条高度（min 100 / max 75vh）
  hs.addEventListener("mousedown", e => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = editor.offsetHeight || 280;
    hs.classList.add("resizing");
    document.body.classList.add("resizing");
    const onMove = ev => {
      const h = Math.min(window.innerHeight * 0.75, Math.max(100, startH + (startY - ev.clientY)));
      editor.style.height = h + "px";
    };
    const onUp = () => {
      hs.classList.remove("resizing");
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      try { localStorage.setItem("loraEditorH", String(editor.offsetHeight)); } catch (err) {}
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  // 恢复持久化的分割尺寸
  try {
    const sw = parseInt(localStorage.getItem("loraSidebarW"), 10);
    if (sw >= 180 && sw <= 560) sidebar.style.width = sw + "px";
    const eh = parseInt(localStorage.getItem("loraEditorH"), 10);
    if (eh >= 100) editor.style.height = eh + "px";
  } catch (err) {}
}

// ---------- 状态消息 ----------
function setMsg(m) { document.getElementById("stMsg").textContent = m; }

// ---------- 初始化 ----------
(function init() {
  const saved = localStorage.getItem("loraTagTheme");
  applyTheme(saved || "dark");
  // 清理历史测试污染的初筛模式记忆（二级菜单已删除，统一批量判定，无需记忆）
  try { localStorage.removeItem("loraScreenMode"); localStorage.removeItem("loraScreenModeV2"); } catch (e) {}
  bindDelegates();
  // 预加载词库（输入框添加标签需优先匹配词库：英文忽略下划线 / 中文匹配翻译）
  loadLibAll();
  // 恢复最近文件夹
  api("/api/settings").then(cfg => {
    if (cfg.recent_dirs && cfg.recent_dirs.length) {
      document.getElementById("folderInput").value = cfg.recent_dirs[0];
      document.getElementById("folderInput").placeholder = `最近: ${cfg.recent_dirs[0]}`;
      scanFolder(); // 最近目录自动扫描（无需输入/回车）
    }
    if (cfg.preview_size) state.previewSize = cfg.preview_size;
    else state.previewSize = 0;
    applyFontSize(cfg.font_size);  // 界面字号档位
    if (cfg.save_concurrency) state.saveConcurrency = cfg.save_concurrency;
  });
})();

/* ========== 背景互动：鼠标跟随金色光晕（rAF 平滑，不干扰任何现有逻辑） ========== */
(function () {
  const glow = document.getElementById("mouseGlow");
  if (!glow) return;
  let tx = -9999, ty = -9999, cx = -9999, cy = -9999, raf = null;
  document.addEventListener("mousemove", e => {
    tx = e.clientX; ty = e.clientY;
    if (!raf) raf = requestAnimationFrame(step);
  }, { passive: true });
  function step() {
    cx += (tx - cx) * 0.14;
    cy += (ty - cy) * 0.14;
    glow.style.left = Math.round(cx) + "px";
    glow.style.top = Math.round(cy) + "px";
    if (Math.abs(tx - cx) > 1.5 || Math.abs(ty - cy) > 1.5) raf = requestAnimationFrame(step);
    else raf = null;
  }
})();
</script>
